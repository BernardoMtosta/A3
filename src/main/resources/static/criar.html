<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="css/CriarConta.css">
</head>
<body>
    <div class="caixa">
        <h1 class="titulo">Crie sua conta</h1>
        <form id="cadastroForm">
            <label for="usuario">Seu usuário:</label>
            <input type="text" id="usuario" name="usuario" class="usuario" required>
            <label for="senha">Sua senha:</label>
            <input type="password" id="senha" name="senha" class="senha" required>
            <button type="submit">Cadastrar</button>
        </form>
    </div>

    <script>
        document.getElementById('cadastroForm').addEventListener('submit', function(event) {
            event.preventDefault();
            const nome = document.getElementById('usuario').value;
            const senha = document.getElementById('senha').value;

            fetch('http://localhost:8081/api/cadastro', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ nome, senha })
            })
            .then(response => response.text())
            .then(data => alert(data))
            .catch(error => console.error('Erro:', error));
        });
    </script>
</body>
</html>
